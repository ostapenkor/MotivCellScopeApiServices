<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчетность - Мотив</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <div class="logo">📡 Мотив</div>
        <div class="tabs">
            <a href="dashboard.html" class="tab">Дашборд</a>
            <a href="incidents.html" class="tab">Аварии</a>
            <a href="reports.html" class="tab active">Отчетность</a>
            <a href="monitoring.html" class="tab">Мониторинг</a>
            <a href="admin.html" class="tab admin-only">Админ-панель</a>
        </div>
        <div class="user-info">
            <span>Роль: <span id="current-role" style="color: #fff; font-weight: bold;">-</span></span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <div class="content">
        <div class="card">
            <div class="table-toolbar">
                <div class="table-filters">
                    <input type="date">
                    <span>—</span>
                    <input type="date">
                    <select><option>Все направления</option><option>СВН</option></select>
                    <select><option>Все критичности</option><option>Critical</option></select>
                    <button class="btn btn-secondary">Найти</button>
                </div>
                <button class="btn btn-primary" onclick="alert('CSV выгружен!')">📥 Выгрузить в CSV</button>
            </div>
            <table>
                <tr>
                    <th>NTT/PW</th><th>Направление</th><th>Severity</th><th>Сетевой элемент</th><th>Начало</th><th>Окончание</th>
                    <th class="hide-for-operator">Действия</th>
                </tr>
                <tr>
                    <td>NTT-63587</td><td>ЮЗН</td>
                    <td><span class="badge badge-red">Critical</span></td>
                    <td>УЗ_044 — БС «Таёжный-044»</td><td>29.08 11:08</td><td>НВ</td>
                    <td class="hide-for-operator"><button class="btn-edit" onclick="alert('Открыть форму редактирования')">✏️</button></td>
                </tr>
                <tr>
                    <td>NTT-63339</td><td>ХМЯН</td>
                    <td><span class="badge badge-green">Low</span></td>
                    <td>УЗ_045 — БС «Восточный-045»</td><td>31.08 04:17</td><td>31.08 04:18</td>
                    <td class="hide-for-operator"><button class="btn-edit" onclick="alert('Открыть форму редактирования')">✏️</button></td>
                </tr>
            </table>
            <div style="text-align: right; margin-top: 15px; color: #8c8c99;">Стр. 1 2 3 ... 10 ></div>
        </div>
    </div>
</body>
</html>
