version: '3.8'

services:
  # 1. Сервис базы данных MariaDB
  motiv-db:
    image: mariadb:10.1
    container_name: motiv_mariadb_container
    restart: always
    environment:
      # Говорим MariaDB читать пароли из секретных файлов в памяти (Рекомендация из видео)
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: motiv_report
      MARIADB_USER_FILE: /run/secrets/db_user
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - motiv_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    secrets:
      - db_root_password
      - db_user
      - db_password
    ports: 
      - "3306:3306"
    networks:
      - motiv-backend-net

  

  motivcellscopeapiservices:
    image: ${DOCKER_REGISTRY-}motivcellscopeapiservices
    container_name: motiv_api_container
    build:
      context: .
      dockerfile: MotivCellScopeApiServices/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - motiv-db
    secrets:
      - db_user
      - db_password   
      - jwt_key
    networks:
      - motiv-backend-net

# Глобальное объявление секретов (Inline-метод, который на 100% поддерживает Visual Studio)
secrets:
  db_root_password:
    environment: "DB_ROOT_PASSWORD"
  db_user:
    environment: "DB_USER"
  db_password:
    environment: "DB_PASSWORD"
  jwt_key:
    environment: "JWT_SECRET_KEY"

volumes:
  motiv_db_data:

networks:
  motiv-backend-net:
    driver: bridge

