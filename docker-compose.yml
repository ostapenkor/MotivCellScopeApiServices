services:
  # 1. Сервис базы данных MariaDB
  motiv-db:
    image: mariadb:10.1
    container_name: motiv_mariadb_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: motiv_report
      MYSQL_USER_FILE: /run/secrets/db_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - motiv_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    secrets:
      - db_root_password
      - db_user
      - db_password
    ports:
      - "3306:3306"
    networks:
      - motiv-backend-net
      

  # 2. ASP.NET Core API
  motivcellscopeapiservices:
    image: ${DOCKER_REGISTRY-}motivcellscopeapiservices
    container_name: motiv_api_container
    build:
      context: .
      dockerfile: MotivCellScopeApiServices/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - motiv-db
    secrets:
      - db_user
      - db_password
      - jwt_key
    networks:
      - motiv-backend-net
      - motiv-frontend-net

  # 3. PHP-сайт поверх REST API
  motiv-web:
    image: php:8.3-apache
    container_name: motiv_web_container
    restart: unless-stopped
    volumes:
      - ./website:/var/www/html
      - ./website/apache-vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      - API_BASE_URL=http://motivcellscopeapiservices:8080
    ports:
      - "8000:80"
    depends_on:
      - motivcellscopeapiservices
    networks:
      - motiv-frontend-net

secrets:
  db_root_password:
    environment: "DB_ROOT_PASSWORD"
  db_user:
    environment: "DB_USER"
  db_password:
    environment: "DB_PASSWORD"
  jwt_key:
    environment: "JWT_SECRET_KEY"

volumes:
  motiv_db_data:

networks:
  motiv-backend-net:
    driver: bridged
  motiv-frontend-net:
    driver: bridge